<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e2bc9"/>
      <stop offset="0.55" stop-color="#8f57e0"/>
      <stop offset="1" stop-color="#f6a9c9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe68a"/>
      <stop offset="1" stop-color="#ffbe6b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d2f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="300" cy="210" r="150" fill="url(#glow)"/>
  <circle cx="300" cy="210" r="88" fill="url(#sun)"/>
  <!-- cloud -->
  <g fill="url(#cloud)">
    <circle cx="170" cy="300" r="62"/>
    <circle cx="250" cy="262" r="84"/>
    <circle cx="335" cy="300" r="60"/>
    <rect x="108" y="290" width="290" height="72" rx="36"/>
  </g>
  <!-- raindrops -->
  <g fill="#6f8ff0">
    <path d="M170 392 q-14 22 0 32 q14 -10 0 -32z"/>
    <path d="M250 404 q-14 22 0 32 q14 -10 0 -32z"/>
    <path d="M330 392 q-14 22 0 32 q14 -10 0 -32z"/>
  </g>
